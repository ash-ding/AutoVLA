name: qwen2.5-vl-3B-mix-sft-10k-action-only
description: AutoVLA Qwen2.5-VL 3B SFT on nuPlan + nuScenes 10k mix, action-only supervision (CoT samples downgraded to action-only).

model:
  use_cot: false
  pretrained_model_path: model_weights/Qwen2.5-VL-3B-Instruct
  train_vision_backbone: false
  train_lm_backbone: true
  codebook_cache_path: codebook_cache/agent_vocab.pkl
  trajectory:
    num_poses: 10
    interval_length: 0.5
    time_horizon: 5.0
  tokens:
    action_start_id: 151665
    ignore_index: -100
    assistant_id: [151644, 77091]
  video:
    min_pixels: 109760
    max_pixels: 109760

training:
  batch_size: 1
  learning_rate: 2.0e-5
  epochs: 5
  num_workers: 4
  weight_decay: 0.01
  lr_warmup_step: 500
  lr_step_frequency: 2000
  lr_step_gamma: 0.98
  train_sample_size: null
  accumulate_grad_batches: 4

data:
  train:
    json_dataset_path:
      - /data/nuplan_nuscenes_train_mix_185k/nuPlan/action_only_samples_120682
      - /data/nuplan_nuscenes_train_mix_185k/nuPlan/nl_reasoning_samples_Qwen2.4_VL_72B_Instruct_AWQ_45600
      - /data/nuplan_nuscenes_train_mix_185k/nuScenes/action_only_samples_16135
      - /data/nuplan_nuscenes_train_mix_185k/nuScenes/nl_reasoning_samples_2895
    sensor_data_path:
      - /data/nuPlan/sensor_blobs/trainval
      - /data/nuPlan/sensor_blobs/trainval
      - /data/nuScenes
      - /data/nuScenes

  val:
    json_dataset_path: /data/nuscenes_test/test_samples_5569
    sensor_data_path: /data/nuScenes

inference:
  batch_size: 1
  num_workers: 2
  sample:
    max_length: 2048
    temperature: 0.8
    top_k: 20
    top_p: 0.2
