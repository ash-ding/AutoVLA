name: qwen2.5-vl-3B-nuplan-cot-10k-sft
description: AutoVLA Qwen2.5-VL 3B SFT on local nuPlan CoT 10k bundle

model:
  use_cot: true
  pretrained_model_path: model_weights/Qwen2.5-VL-3B-Instruct
  train_vision_backbone: false
  train_lm_backbone: true
  codebook_cache_path: codebook_cache/agent_vocab.pkl
  trajectory:
    num_poses: 10
    interval_length: 0.5
    time_horizon: 5.0
  tokens:
    action_start_id: 151665
    ignore_index: -100
    assistant_id: [151644, 77091]
  video:
    min_pixels: 109760
    max_pixels: 109760

training:
  batch_size: 1
  learning_rate: 2.0e-5
  epochs: 1
  num_workers: 2
  weight_decay: 0.01
  lr_warmup_step: 100
  lr_step_frequency: 1000
  lr_step_gamma: 0.98
  train_sample_size: null
  accumulate_grad_batches: 4

data:
  train:
    json_dataset_path:
      - /home/labmanger/autovla_slim/nuplan_cot_10k/json/nuPlan_cot
    sensor_data_path:
      - /home/labmanger/autovla_slim/nuplan_cot_10k/sensor_blobs/trainval

  val:
    json_dataset_path: /home/labmanger/autovla_slim/nuplan_cot_10k/json/nuPlan_cot_val500
    sensor_data_path: /home/labmanger/autovla_slim/nuplan_cot_10k/sensor_blobs/trainval

inference:
  batch_size: 1
  num_workers: 2
  sample:
    max_length: 2048
    temperature: 0.8
    top_k: 20
    top_p: 0.2
