name: nocot-nuplan-trainval
description: No-CoT preprocessing for the full nuPlan trainval split; combined with --pre_generated_dir it produces the complement of the Qwen2.5-VL-72B-AWQ CoT subset.

# No 'pretrained_model_path' — no-CoT output is model-agnostic (only raw scene metadata + camera paths).
# The preprocessing script detects the missing key and skips processor loading entirely.

batch_size: 1
num_workers: 8

dataset_name: nuplan
# 'placeholder' is replaced with 'navsim_logs' / 'sensor_blobs' at runtime by nuplan_dataset.py.
# Final paths: /data/nuPlan/navsim_logs/trainval/<log>.pkl, /data/nuPlan/sensor_blobs/trainval/<log>/<cam>/<jpg>
dataset_path: /data/nuPlan/placeholder/trainval
scene_filter: /root/code/AutoVLA/navsim/navsim/planning/script/config/common/train_test_split/scene_filter/all_scenes.yaml
