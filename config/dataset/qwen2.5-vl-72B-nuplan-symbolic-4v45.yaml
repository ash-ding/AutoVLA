name: qwen2.5-vl-72B-nuplan-symbolic-4v45
description: |
  Symbolic CoT preprocessing on nuPlan trainval, 4-view teacher (front + back +
  front-left + front-right) with 45° forward-canted side cameras
  (CAM_L0 / CAM_R0). Teacher: Qwen2.5-VL-72B-AWQ via vLLM. Used by ablation
  Arm C (45° side).

# Annotation backend
annotation_backend: vllm
pretrained_model_path: /backup/autovla_models/Qwen2.5-VL-72B-Instruct-AWQ
tensor_parallel_size: 1
batch_size: 32
max_num_seqs: 32
max_model_len: 16384
prefetch_factor: 4
num_workers: 2

# Sampling
temperature: 0
seed: 42

# Symbolic CoT
rlib_dir: ./symdrive/rlib1_0/rlib
cot_style: rlib1.0

# Teacher camera setup — 4 view, 45° forward-canted side cameras
include_back_view: true
side_cam_yaw: 45

# Dataset
dataset_name: nuplan
dataset_path: /data/nuPlan/placeholder/trainval
scene_filter: /root/code/AutoVLA/navsim/navsim/planning/script/config/common/train_test_split/scene_filter/all_scenes.yaml
