name: qwen2.5-vl-72B-nuplan-8gpu-tp1
description: Preprocessing dataset for AutoVLA with Qwen 2.5 VL 72B model on NuPlan dataset for CoT generation — 8 shards, 1 GPU each (TP=1) for A100-80GB

# model
pretrained_model_path: /root/AutoVLA/autovla_models/Qwen2.5-VL-72B-Instruct-AWQ
tensor_parallel_size: 1

# training
batch_size: 16
max_num_seqs: 16
max_model_len: 16384
prefetch_factor: 4
num_workers: 4

# dataset (the split should match the dataset path)
dataset_name: nuplan
dataset_path: /data/trainval_placeholder/trainval
scene_filter: /root/AutoVLA/navsim/navsim/planning/script/config/common/train_test_split/scene_filter/all_scenes.yaml
