name: qwen2.5-vl-72B-nuscenes-symbolic-4v
description: |
  Symbolic CoT preprocessing on nuScenes trainval, 4-view teacher
  (front + back + front-left + front-right). Teacher: Qwen2.5-VL-72B-AWQ via
  vLLM. Used by ablation Arms A and C (both keep nuScenes back-view).

# Annotation backend
annotation_backend: vllm
pretrained_model_path: /backup/autovla_models/Qwen2.5-VL-72B-Instruct-AWQ
tensor_parallel_size: 1
batch_size: 32
max_num_seqs: 32
max_model_len: 16384
prefetch_factor: 4
num_workers: 2

# Sampling
temperature: 0
seed: 42

# Symbolic CoT
rlib_dir: ./symdrive/rlib1_0/rlib
cot_style: rlib1.0

# Teacher camera setup — nuScenes 4-view (CAM_FRONT/FRONT_LEFT/FRONT_RIGHT/BACK)
include_back_view: true

# Dataset (NuscenesCoTAnnotationDataset)
dataset_name: nuscenes
dataset_path: /data/nuScenes
version: v1.0-trainval
split: train
num_history_frames: 4
num_future_frames: 16
